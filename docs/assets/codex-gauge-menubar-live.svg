<svg xmlns="http://www.w3.org/2000/svg" width="820" height="248" viewBox="0 0 820 248" role="img" aria-labelledby="title desc">
  <title id="title">Codex Gauge live menu bar preview</title>
  <desc id="desc">A clean menu bar crop showing Codex Gauge with two quota rows and vector reset faces.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e9dd7"/>
      <stop offset=".56" stop-color="#2b86bf"/>
      <stop offset="1" stop-color="#226fa6"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001015" stop-opacity=".22"/>
      <stop offset="1" stop-color="#001015" stop-opacity="0"/>
    </linearGradient>
    <filter id="pillShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#08202a" flood-opacity=".26"/>
    </filter>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 32px; font-weight: 800; fill: #f8fcff; letter-spacing: 0; }
      .tiny { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 29px; font-weight: 800; fill: #f7fbff; letter-spacing: 0; }
      .time { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 800; fill: #d5e0e5; letter-spacing: 0; opacity: .92; }
      .faceInk { stroke: #17130d; stroke-width: 2.2; stroke-linecap: round; fill: none; opacity: .68; }
      .faceEye { fill: #17130d; opacity: .68; }
    </style>
  </defs>

  <rect width="820" height="138" fill="url(#desk)"/>
  <rect y="0" width="820" height="78" fill="url(#shadow)"/>
  <rect y="138" width="820" height="110" fill="#f7efd9"/>

  <g transform="translate(42 24)" filter="url(#pillShadow)">
    <rect x="0" y="0" width="760" height="86" rx="10" fill="#073034" stroke="#69aaa4" stroke-opacity=".62" stroke-width="2"/>
    <text x="26" y="33" class="mono">5h</text>
    <rect x="108" y="24" width="204" height="10" rx="5" fill="#d9f5f2" opacity=".25"/>
    <rect x="108" y="24" width="184" height="10" rx="5" fill="#26d3a0"/>
    <text x="336" y="35" class="tiny">90%</text>
    <rect x="494" y="24" width="164" height="10" rx="5" fill="#f8e7c1" opacity=".22"/>
    <rect x="494" y="24" width="62" height="10" rx="5" fill="#ee7a31" opacity=".78"/>
    <g transform="translate(556 29)">
      <circle r="13" fill="#ee7a31"/>
      <circle cx="-4.1" cy="-2.7" r="1.5" class="faceEye"/>
      <circle cx="4.1" cy="-2.7" r="1.5" class="faceEye"/>
      <path d="M -6.4 4.7 Q 0 .2 6.4 4.7" class="faceInk"/>
    </g>
    <text x="650" y="35" class="time">4h</text>

    <text x="26" y="67" class="mono">7d</text>
    <rect x="108" y="58" width="204" height="10" rx="5" fill="#d9f5f2" opacity=".25"/>
    <rect x="108" y="58" width="164" height="10" rx="5" fill="#6bd883"/>
    <text x="336" y="69" class="tiny">80%</text>
    <rect x="494" y="58" width="164" height="10" rx="5" fill="#f8e7c1" opacity=".22"/>
    <rect x="494" y="58" width="25" height="10" rx="5" fill="#d94246" opacity=".78"/>
    <g transform="translate(518 63)">
      <circle r="13" fill="#d94246"/>
      <circle cx="-4.1" cy="-2.4" r="1.5" class="faceEye"/>
      <circle cx="4.1" cy="-2.4" r="1.5" class="faceEye"/>
      <path d="M -6.8 -6.4 L -2.2 -4.7 M 2.2 -4.7 L 6.8 -6.4" class="faceInk"/>
      <path d="M -6.4 4.8 Q 0 -1.2 6.4 4.8" class="faceInk"/>
    </g>
    <text x="650" y="69" class="time">6d8h</text>
  </g>
</svg>
